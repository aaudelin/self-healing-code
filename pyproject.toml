[project]
name = "self-healer"
version = "0.1.0"
description = "Self-Healing Software Agent — local MVP orchestrating Claude agents to triage, reproduce, fix, test, and PR software incidents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "anthropic>=0.39.0",
    "claude-agent-sdk>=0.1.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
    "httpx>=0.27.2",
    "aiofiles>=24.1.0",
    "docker>=7.1.0",
    "gitpython>=3.1.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["self_healer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
